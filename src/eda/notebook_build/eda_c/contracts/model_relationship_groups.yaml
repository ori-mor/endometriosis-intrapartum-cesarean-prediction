# ============================================================================
# model_relationship_groups.yaml
# ============================================================================
# CANONICAL, hand-reviewed SOURCE OF TRUTH for the many-to-many REVIEW
# relationship groups of clinically / numerically overlapping predictors that
# remain JOINTLY eligible. This YAML file is the ONLY authoritative authored
# source. EDA C Section C13 reads it directly on a fresh checkout.
#
# modeling_action is always review_within_modeling. This file is NOT a hard
# exclusion source and NEVER changes eligibility. A variable may appear in
# several groups.
#
# The run-specific snapshot exported to outputs/eda_c/model_relationship_groups.csv
# (one row per group x variable) is a GENERATED modeling-handoff artifact derived
# from this file -- not a second source of truth.
#
# Migrated from the reviewed CSV to YAML during the 2026-09-01 Git closure
# (content byte-preserved -- no group / member / rationale change).
# ============================================================================

relationship_groups:
  - group_name: "parity_obstetric_history"
    relationship_type: "shared_obstetric_history_counts"
    modeling_action: "review_within_modeling"
    rationale: "Overlapping gravidity/parity history counts and the derived binary nulliparity. Nested/threshold representations of the same obstetric history; each member may still carry information the others do not (e.g. losses vs. live births). Co-entry is a modeling-review decision (rank deficiency / VIF within the training process), not a global ban. NOTE on P <-> nulliparity specifically: nulliparity == I(P == 0) is deterministically derived from the parity count P, but it is a NONLINEAR basis function of P, not a linear re-expression -- a logistic-regression design holding P as a count term and I(P == 0) as a binary threshold term can jointly encode a threshold deviation at parity zero and is not necessarily rank-deficient. P and nulliparity are therefore BOTH jointly eligible; their joint entry is a modeling-review / coefficient-stability / nonlinear-basis matter handled within CV, NOT a global hard co-entry pair. Deterministic derivability alone does not justify a permanent co-entry prohibition."
    decision_source: "config.py REDUNDANCY_GROUPS['parity_history'] (legacy descriptive) + PARTNER-FIX-03B nulliparity<-P migration. (Final D rebuild closure pass, 2026-09-01: an interim decision that promoted P <-> nulliparity to a hard co-entry pair was SUPERSEDED and reverted to this review-only treatment.)"
    variables:
      - "G"
      - "P"
      - "AB"
      - "EUP"
      - "LIVE_BIRTH"
      - "nulliparity"
  - group_name: "prior_cesarean_history"
    relationship_type: "prior_cesarean_history"
    modeling_action: "review_within_modeling"
    rationale: "Prior-cesarean count (CS), the binary status-post-CS flag (S_P_CS) and prior successful VBAC. Clinically overlapping but not a deterministic pair: CS is a count, S_P_CS a threshold on it, VBAC an outcome of a prior trial of labor. Modeling review only."
    decision_source: "Clinical variable documentation; config.py REDUNDANCY_GROUPS (legacy descriptive)."
    variables:
      - "CS"
      - "S_P_CS"
      - "VBAC"
  - group_name: "prepregnancy_anthropometry"
    relationship_type: "anthropometric_index_and_components"
    modeling_action: "review_within_modeling"
    rationale: "BMI_before is the index; weight_before_pregnancy and height are its mathematical components. Not a global hard ban (each component may carry independent signal); BMI_before's own fold-safe recompute reads the components internally as transform dependencies. Modeling review / collinearity handling only."
    decision_source: "cleaning_b_part4_transformations_imputation_plan.py (BMI_before recompute) + modeling_core.py _BMI_BEFORE_DEPENDENCY_COLS."
    variables:
      - "BMI_before"
      - "weight_before_pregnancy"
      - "height"
  - group_name: "pregnancy_anthropometry"
    relationship_type: "anthropometric_index_and_components"
    modeling_action: "review_within_modeling"
    rationale: "BMI_after is the near-delivery index; weight_in_pregnancy and height are its mathematical source family. BMI_after and weight_in_pregnancy are transform_source_only (fold-safe quantile categorical). Do not co-enter raw BMI_after alongside its mathematical source family without modeling review; not a global deterministic pair."
    decision_source: "cleaning_b_feature_dictionary.csv (BMI_after row) + modeling_core.py _FOLD_SAFE_QUANTILE_SPECS."
    variables:
      - "BMI_after"
      - "weight_in_pregnancy"
      - "height"
  - group_name: "hypertension_spectrum"
    relationship_type: "hypertension_spectrum_representation"
    modeling_action: "review_within_modeling"
    rationale: "derived_hypertension_pih_pet_spectrum is an approved 3-level grouped representation of the hypertension family, defined from clinical semantics (Decision 45/77) not target association. It is NOT an automatic hard pair against each individual PIH/PET subtype: a subtype may carry detail the grouped level collapses. any_PET_cat/severe_PET_cat are approved standalone predictor_allowed/Stage 1 predictors (Decision 94) and formula inputs / clinical-redundancy-family members of the spectrum; their addition here is metadata visibility only, not a new eligibility or hard-pair decision. Co-entry is review_within_modeling."
    decision_source: "Decision 45/77/94; eda_c_part3_feature_engineering.py C9 (derived_hypertension_pih_pet_spectrum) + DERIVED_REDUNDANCY_GROUPS."
    variables:
      - "PIH"
      - "mild_PET"
      - "SIPET"
      - "pregnancy_related_hypertensive_disorder"
      - "any_PET_cat"
      - "severe_PET_cat"
      - "derived_hypertension_pih_pet_spectrum"
  - group_name: "placental_dysfunction_proxy"
    relationship_type: "placental_dysfunction_proxy_representation"
    modeling_action: "review_within_modeling"
    rationale: "derived_placental_dysfunction_proxy is an exploratory OR-composite proxy (any_PET_cat=='present' OR IUGR==1) materialized once any_PET_cat is available as a standalone predictor (Decision 94). It is NOT an exact one-to-one re-expression of any single source -- an OR-composite of multiple sources is not automatically a global hard pair with each of them, so this is review-only, matching the existing C8 redundancy_family_columns contract for this feature. severe_PET_cat and derived_hypertension_pih_pet_spectrum are listed as clinically related family members, not formula inputs (the formula reads only any_PET_cat and IUGR)."
    decision_source: "Decision 94; eda_c_part3_feature_engineering.py C8/C9 (derived_placental_dysfunction_proxy redundancy_family_columns)."
    variables:
      - "derived_placental_dysfunction_proxy"
      - "any_PET_cat"
      - "severe_PET_cat"
      - "IUGR"
      - "derived_hypertension_pih_pet_spectrum"
  - group_name: "diabetes_representation"
    relationship_type: "diabetes_representation"
    modeling_action: "review_within_modeling"
    rationale: "diabetes_type and derived_diabetes_type_grouped ARE an approved hard deterministic co-entry pair (see model_coentry_constraints.csv). gestational_diabetes is REVIEW-ONLY here: current executable lineage does not derive it from diabetes_type and does not prove deterministic equivalence/recoverability, so it is not promoted to a hard constraint in this pass."
    decision_source: "Decision 78; eda_c_part3_feature_engineering.py C9; D3 review item (2026-09-01 pre-C13 contract freeze)."
    variables:
      - "gestational_diabetes"
      - "diabetes_type"
      - "derived_diabetes_type_grouped"
  - group_name: "endometrioma_representation_phenotype"
    relationship_type: "endometrioma_representation"
    modeling_action: "review_within_modeling"
    rationale: "endometrioma <-> endometrioma_size_status and endometrioma <-> endometrioma_presence_laterality are approved hard deterministic pairs (the status/laterality columns encode presence). The two derived representations vs. each other (size vs. laterality) are review_within_modeling: they encode different phenotype axes."
    decision_source: "Data Cleaning B Section B5c; cleaning_b_feature_dictionary.csv; Decisions 22/24/25/70/84."
    variables:
      - "endometrioma"
      - "endometrioma_size_status"
      - "endometrioma_presence_laterality"
  - group_name: "prior_endometriosis_surgery"
    relationship_type: "prior_endo_surgery_representation"
    modeling_action: "review_within_modeling"
    rationale: "endometriosis_surgery <-> derived_endo_surgery_adhesion_status and endometriosis_surgery <-> derived_prior_endo_surgery_procedure_status are approved hard deterministic pairs (the derived statuses encode the surgery/no-surgery state). The endo_resection_* multi-hot family and the two derived statuses overlap clinically but are NOT global hard pairs with each other; co-entry is review_within_modeling."
    decision_source: "Decision 19/20/91; eda_c_part3_feature_engineering.py C8/C9 redundancy_family_columns."
    variables:
      - "endometriosis_surgery"
      - "derived_endo_surgery_adhesion_status"
      - "derived_prior_endo_surgery_procedure_status"
      - "endo_resection_no_resection"
      - "endo_resection_ovarian_endometrioma_unilateral"
      - "endo_resection_ovarian_endometrioma_bilateral"
      - "endo_resection_adnexa"
      - "endo_resection_fallopian_tube"
      - "endo_resection_epiploica"
      - "endo_resection_uterus"
      - "endo_resection_lesion"
      - "endo_resection_adhesiolysis"
      - "endo_resection_appendix"
  - group_name: "adenomyosis_parent_and_multihot"
    relationship_type: "parent_and_multihot_representation"
    modeling_action: "review_within_modeling"
    rationale: "adenomyosis is the parent binary; adenomyosis_feature_1..11 + adenomyosis_features_unknown are the sonographic multi-hot family. adenomyosis is NOT a global hard pair with each individual feature indicator (a feature can be present without the parent being the only signal, and vice versa). Co-entry / collapsing is a modeling-review decision."
    decision_source: "Decision 91; adenomyosis sonographic 12-column multi-hot family (cleaning_b_feature_dictionary.csv)."
    variables:
      - "adenomyosis"
      - "adenomyosis_feature_1"
      - "adenomyosis_feature_2"
      - "adenomyosis_feature_3"
      - "adenomyosis_feature_4"
      - "adenomyosis_feature_5"
      - "adenomyosis_feature_6"
      - "adenomyosis_feature_7"
      - "adenomyosis_feature_8"
      - "adenomyosis_feature_9"
      - "adenomyosis_feature_10"
      - "adenomyosis_feature_11"
      - "adenomyosis_features_unknown"
  - group_name: "pprom_timing"
    relationship_type: "pprom_timing_representation"
    modeling_action: "review_within_modeling"
    rationale: "Descriptive context for the approved hard pair PPROM <-> gestational_age_at_PPROM_days (constraint applies to the fold-safe PPROM-timing model representation, see model_coentry_constraints.csv). Listed here so the timing family is visible in modeling review."
    decision_source: "Data Cleaning B Section B5b; eda_c_part4_screening.py DERIVED_REDUNDANCY_GROUPS['pprom_timing_representation']."
    variables:
      - "PPROM"
      - "gestational_age_at_PPROM_days"
  - group_name: "conception_mode_representation"
    relationship_type: "conception_mode_representation"
    modeling_action: "review_within_modeling"
    rationale: "Descriptive context for the approved hard pair mode_of_conception <-> mode_of_conception_ivf_vs_all (ivf_vs_all is a deterministic recompute of mode_of_conception, see model_coentry_constraints.csv)."
    decision_source: "Decision 30; run_preprocessing.py Batch 2 Step 0."
    variables:
      - "mode_of_conception"
      - "mode_of_conception_ivf_vs_all"
  - group_name: "labor_induction_representation"
    relationship_type: "labor_induction_representation"
    modeling_action: "review_within_modeling"
    rationale: "Descriptive context for the approved hard pair induction_any_bin <-> indication_for_induction_status (the status encodes the binary induction indicator, see model_coentry_constraints.csv)."
    decision_source: "Data Cleaning B Section B5h; cleaning_b_feature_dictionary.csv."
    variables:
      - "induction_any_bin"
      - "indication_for_induction_status"
