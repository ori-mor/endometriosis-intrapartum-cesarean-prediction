  description_he: 'מאפיינים סונגרפיים של אדנומיוזיס '
  codes_he: '1 - רחם במבנה גלובולרי, 2 - מנח בצורת "סימן שאלה", 3 - אסימטריה בין הדפנות, 4 - איים אקוגניים במיומטריום או מיומטריום באקוגניות מוגבר, 5 - ציסטות מיומטריאליות, 6 - אי סדירות של Junctional Zone (אזור החיבור), 7 - עיבוי של אזור החיבור, 8 - מבנים אקוגנים ב junctional zone/ ולחילופין: buds אקוגנים ב junctional zone (אזור החיבור), 9 - הצללות בצורת מניפה, 10 - גבול המיומטריום אנדומטריום או: גבול המיומטריום אנדומטריום לא חד, 11 - זרימות דם דיפוזיות (אבל זה משהו שכותבים גם על ממצאים שלא קשורים לאנדו)'
- name: endometriosis_surgery
