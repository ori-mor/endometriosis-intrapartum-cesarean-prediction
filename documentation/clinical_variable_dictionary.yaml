  codes_he: 'הערך 0 מייצג לידה וגינלית רגילה ומשמש כקבוצת הביקורת של המחקר. ההבחנה בין ניתוח חירום (Emergency, קידוד 2) לניתוח בהול (Urgent, קידוד 3) תלויה בדחיפות הקלינית: בעוד שחירום מאפשר התארגנות מסודרת יחסית (למשל, מוניטור לא תקין אך יציב), ניתוח בהול מבוצע במצבי סכנה מיידית (כמו האטות דופק עוברי שאינן משתפרות) ומחייב פעולה מהירה ביותר.'
