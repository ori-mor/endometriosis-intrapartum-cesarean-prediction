  codes_he: 0 – התחלה ספונטנית; 1 – בלון; 2 – בלון ופיטוצין; 3 – פרוסטגלנדינים, כגון מיזופרוסטול או פרופס; 4 – פיטוצין; 5 – ניתוח קיסרי.
