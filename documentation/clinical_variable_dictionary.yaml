  codes_he: null
- name: magnesium
  description_he: בינארי - האם נלקח מגנזיום, במהלך ההריון. המגנזיום מוגדר כNeuroprotection (מגן על מוח העובר בסכנה של לידה מוקדמת עד שבוע 32, ניתן למשך 24 שעות). ומתן מגנזיום הוכח כמפחית ב-40% את הסיכון לשיתוק מוחין (CP), שהסיבה השכיחה ביותר לו היא פגות
  codes_he: null
- name: comment_2
